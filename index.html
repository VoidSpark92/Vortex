<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VORTEX // 1v1 Battle</title>
  
  <!-- Three.js & PeerJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0f172a;
    }

    #gameViewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Crosshair */
    .crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 20;
    }
    .crosshair::before, .crosshair::after {
      content: '';
      position: absolute;
      background: #0284c7;
    }
    .crosshair::before { top: 3px; left: -12px; width: 32px; height: 2px; }
    .crosshair::after { top: -12px; left: 3px; width: 2px; height: 32px; }

    /* In-Game HUD */
    .hud-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .hud-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .team-score, .match-timer {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(10px);
    }
    .blue-team { color: #0284c7; }
    .red-team { color: #e11d48; }
    .match-timer { color: #0f172a; letter-spacing: 1px; }

    .hud-bottom-stats {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .health-card, .ammo-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(12px);
    }
    .stat-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 6px;
    }
    .health-bar-bg {
      width: 160px;
      height: 10px;
      background: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .health-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      transition: width 0.2s ease;
    }
    .stat-num { font-size: 1.2rem; font-weight: 900; color: #0f172a; }

    .ammo-display { display: flex; align-items: baseline; gap: 4px; }
    .ammo-current { font-size: 1.8rem; font-weight: 900; color: #0284c7; line-height: 1; }
    .ammo-divider, .ammo-reserve { font-size: 1rem; color: #64748b; font-weight: 700; }

    /* Mobile Touch Layout */
    .mobile-hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 25;
    }
    .hud-element {
      position: absolute;
      pointer-events: auto;
      touch-action: none;
    }
    #touchJoystick { bottom: 40px; left: 40px; }
    .joystick-base {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.45);
      border: 2px solid rgba(2, 132, 199, 0.5);
      border-radius: 50%;
      position: relative;
    }
    .joystick-knob {
      width: 48px;
      height: 48px;
      background: #0284c7;
      border-radius: 50%;
      position: absolute;
      top: 36px;
      left: 36px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.5);
    }

    .action-touch-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(2, 132, 199, 0.4);
      font-size: 1.4rem;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      cursor: pointer;
    }
    .action-touch-btn:active {
      background: #0284c7;
      transform: scale(0.92);
    }
    #btnFire { bottom: 50px; right: 35px; width: 78px; height: 78px; border-color: #e11d48; }
    #btnAim { bottom: 145px; right: 35px; }
    #btnJump { bottom: 50px; right: 130px; }
    #btnReload { bottom: 145px; right: 120px; font-size: 1.1rem; }

    /* ========================================================
       PERFECT CENTERED LOBBY MODAL
       ======================================================== */
    .lobby-wrapper {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      background: rgba(15, 23, 42, 0.75) !important;
      backdrop-filter: blur(12px) !important;
      padding: 16px !important;
    }

    .lobby-card {
      background: #ffffff !important;
      width: 100% !important;
      max-width: 480px !important;
      border-radius: 24px !important;
      padding: 32px 28px !important;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35) !important;
      border: 1px solid rgba(255, 255, 255, 0.4) !important;
      text-align: center !important;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .lobby-header h1 {
      font-size: 2.4rem !important;
      font-weight: 900 !important;
      letter-spacing: -0.5px !important;
      color: #0f172a !important;
      margin: 0 0 4px 0 !important;
    }

    .lobby-header p {
      font-size: 0.85rem !important;
      font-weight: 700 !important;
      color: #0284c7 !important;
      text-transform: uppercase !important;
      letter-spacing: 1px !important;
      margin: 0 0 24px 0 !important;
    }

    .p2p-panel {
      background: #f8fafc !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 18px !important;
      padding: 18px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 14px !important;
      margin-bottom: 22px !important;
    }

    .room-box label {
      display: block !important;
      text-align: left !important;
      font-size: 0.78rem !important;
      font-weight: 700 !important;
      color: #475569 !important;
      margin-bottom: 6px !important;
      text-transform: uppercase !important;
      letter-spacing: 0.5px !important;
    }

    .copy-row, .join-row {
      display: flex !important;
      gap: 8px !important;
      width: 100% !important;
    }

    .copy-row input, .join-row input {
      flex: 1 !important;
      height: 44px !important;
      padding: 0 14px !important;
      border-radius: 10px !important;
      border: 1.5px solid #cbd5e1 !important;
      background: #ffffff !important;
      font-size: 0.95rem !important;
      font-family: monospace !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      outline: none !important;
    }
    .copy-row input:focus, .join-row input:focus {
      border-color: #0284c7 !important;
    }

    .btn-action {
      height: 44px !important;
      padding: 0 18px !important;
      border-radius: 10px !important;
      border: none !important;
      background: #0284c7 !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 0.9rem !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      white-space: nowrap !important;
    }
    .btn-action:hover {
      background: #0369a1 !important;
      transform: translateY(-1px) !important;
    }

    .btn-play-bots {
      width: 100% !important;
      height: 48px !important;
      border: none !important;
      border-radius: 12px !important;
      background: linear-gradient(135deg, #0284c7, #0369a1) !important;
      color: #ffffff !important;
      font-size: 1rem !important;
      font-weight: 800 !important;
      letter-spacing: 0.5px !important;
      cursor: pointer !important;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35) !important;
      transition: all 0.2s ease !important;
    }
    .btn-play-bots:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 10px 24px rgba(2, 132, 199, 0.45) !important;
    }

    .lobby-footer-note {
      font-size: 0.78rem !important;
      color: #64748b !important;
      margin-top: 18px !important;
      line-height: 1.4 !important;
    }
  </style>
</head>
<body>

  <!-- 3D Canvas Viewport -->
  <div id="gameViewport"></div>

  <!-- In-Game HUD -->
  <div id="gameHUD" class="hud-overlay" style="display: none;">
    <div class="crosshair"></div>

    <div class="hud-top">
      <div class="team-score blue-team">YOU: <span id="blueScore">0</span></div>
      <div class="match-timer" id="connectionStatus">STANDBY</div>
      <div class="team-score red-team">RIVAL: <span id="redScore">0</span></div>
    </div>

    <div class="hud-bottom-stats">
      <div class="health-card">
        <span class="stat-label">HEALTH</span>
        <div class="health-bar-bg">
          <div class="health-bar-fill" id="hpBar"></div>
        </div>
        <span class="stat-num" id="hpText">100</span>
      </div>

      <div class="ammo-card">
        <span class="stat-label">RIFLE</span>
        <div class="ammo-display">
          <span class="ammo-current" id="ammoCurrent">30</span>
          <span class="ammo-divider">/</span>
          <span class="ammo-reserve" id="ammoReserve">90</span>
        </div>
      </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobileControlsLayer" class="mobile-hud">
      <div id="touchJoystick" class="hud-element" data-id="joystick">
        <div class="joystick-base">
          <div class="joystick-knob" id="joystickKnob"></div>
        </div>
      </div>

      <button id="btnFire" class="hud-element action-touch-btn fire-touch" data-id="fire">🔥</button>
      <button id="btnAim" class="hud-element action-touch-btn aim-touch" data-id="aim">🎯</button>
      <button id="btnJump" class="hud-element action-touch-btn jump-touch" data-id="jump">⬆</button>
      <button id="btnReload" class="hud-element action-touch-btn reload-touch" data-id="reload">🔄</button>
    </div>
  </div>

  <!-- FIXED CLEAN CENTERED LOBBY SCREEN -->
  <div id="lobbyScreen" class="lobby-wrapper">
    <div class="lobby-card">
      <div class="lobby-header">
        <h1>VORTEX</h1>
        <p>1v1 Tactical P2P Arena</p>
      </div>

      <div class="p2p-panel">
        <div class="room-box">
          <label>Your Room ID:</label>
          <div class="copy-row">
            <input type="text" id="myPeerId" readonly value="Generating ID...">
            <button class="btn-action" onclick="copyMyId()">Copy</button>
          </div>
        </div>

        <div class="room-box">
          <label>Join Friend's Room:</label>
          <div class="join-row">
            <input type="text" id="friendPeerId" placeholder="Paste friend ID here">
            <button class="btn-action" onclick="joinFriend()">Connect ⚔️</button>
          </div>
        </div>
      </div>

      <button class="btn-play-bots" onclick="startSinglePractice()">Single Practice (Bots) 🤖</button>

      <div class="lobby-footer-note">
        Ek jan apna ID copy karke dost ko de, doosra paste karke <strong>Connect</strong> dabaye!
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
