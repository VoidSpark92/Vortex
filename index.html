<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VORTEX // 1v1 Battle</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js & PeerJS (Direct P2P Multiplayer) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="gameViewport"></div>

  <!-- HUD -->
  <div id="gameHUD" class="hud-overlay" style="display: none;">
    <div class="crosshair"></div>

    <div class="hud-top">
      <div class="team-score blue-team">YOU: <span id="blueScore">0</span></div>
      <div class="match-timer" id="connectionStatus">P2P CONNECTED</div>
      <div class="team-score red-team">RIVAL: <span id="redScore">0</span></div>
    </div>

    <div class="hud-bottom-stats">
      <div class="health-card">
        <span class="stat-label">HEALTH</span>
        <div class="health-bar-bg">
          <div class="health-bar-fill" id="hpBar"></div>
        </div>
        <span class="stat-num" id="hpText">100</span>
      </div>

      <div class="ammo-card">
        <span class="stat-label">RIFLE</span>
        <div class="ammo-display">
          <span class="ammo-current" id="ammoCurrent">30</span>
          <span class="ammo-divider">/</span>
          <span class="ammo-reserve" id="ammoReserve">90</span>
        </div>
      </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobileControlsLayer" class="mobile-hud">
      <div id="touchJoystick" class="hud-element" data-id="joystick">
        <div class="joystick-base">
          <div class="joystick-knob" id="joystickKnob"></div>
        </div>
      </div>

      <button id="btnFire" class="hud-element action-touch-btn fire-touch" data-id="fire">🔥</button>
      <button id="btnAim" class="hud-element action-touch-btn aim-touch" data-id="aim">🎯</button>
      <button id="btnJump" class="hud-element action-touch-btn jump-touch" data-id="jump">⬆</button>
      <button id="btnReload" class="hud-element action-touch-btn reload-touch" data-id="reload">🔄</button>
    </div>
  </div>

  <!-- Lobby & 1v1 Room Code System -->
  <div id="lobbyScreen" class="lobby-wrapper">
    <div class="lobby-card">
      <div class="lobby-header">
        <h1>VORTEX</h1>
        <p>1v1 Tactical P2P Arena</p>
      </div>

      <!-- Room Code Controls -->
      <div class="p2p-panel">
        <div class="room-box">
          <label>Your Room ID:</label>
          <div class="copy-row">
            <input type="text" id="myPeerId" readonly value="Generating ID...">
            <button onclick="copyMyId()">Copy</button>
          </div>
        </div>

        <div class="room-box">
          <label>Join Friend's Room:</label>
          <div class="join-row">
            <input type="text" id="friendPeerId" placeholder="Paste friend's ID here">
            <button class="btn-join" onclick="joinFriend()">Connect ⚔️</button>
          </div>
        </div>
      </div>

      <div class="lobby-buttons-row">
        <button class="btn-play" onclick="startSinglePractice()">Single Practice (Bots) 🤖</button>
      </div>

      <div class="lobby-footer-note">
        Ek jan apna ID copy karke dost ko de, doosra paste karke <strong>Connect</strong> dabaye!
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
