<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VORTEX // 1v1 Battle</title>
  
  <!-- Three.js & PeerJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #e2e8f0;
      color: #0f172a;
    }

    #gameViewport {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
    }

    /* Crosshair */
    .crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 10px; height: 10px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .crosshair::before, .crosshair::after {
      content: ''; position: absolute; background: #0284c7;
    }
    .crosshair::before { top: 4px; left: -10px; width: 30px; height: 2px; }
    .crosshair::after { top: -10px; left: 4px; width: 2px; height: 30px; }

    /* In-Game HUD */
    .hud-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px;
    }

    .hud-top {
      display: flex; justify-content: center; align-items: center; gap: 20px;
    }
    .team-score, .match-timer {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 8px 18px; border-radius: 20px;
      font-weight: 800; font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(8px);
    }
    .blue-team { color: #0284c7; }
    .red-team { color: #e11d48; }
    .match-timer { color: #0f172a; }

    /* Health & Ammo Cards */
    .hud-bottom-stats {
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .health-card, .ammo-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px; padding: 12px 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(10px);
    }
    .stat-label {
      font-size: 0.7rem; font-weight: 800; color: #64748b; letter-spacing: 1px;
      display: block; margin-bottom: 4px;
    }
    .health-bar-bg {
      width: 160px; height: 10px; background: #e2e8f0;
      border-radius: 5px; overflow: hidden; margin-bottom: 4px;
    }
    .health-bar-fill {
      width: 100%; height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      transition: width 0.2s ease;
    }
    .stat-num { font-size: 1.1rem; font-weight: 900; color: #0f172a; }

    .ammo-display { display: flex; align-items: baseline; gap: 4px; }
    .ammo-current { font-size: 1.6rem; font-weight: 900; color: #0284c7; }
    .ammo-divider, .ammo-reserve { font-size: 1rem; color: #64748b; font-weight: 700; }

    /* Mobile Touch Layer */
    .mobile-hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    .hud-element {
      position: absolute; pointer-events: auto; touch-action: none;
    }

    #touchJoystick { bottom: 40px; left: 40px; }
    .joystick-base {
      width: 120px; height: 120px;
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid rgba(2, 132, 199, 0.4);
      border-radius: 50%; position: relative;
    }
    .joystick-knob {
      width: 50px; height: 50px;
      background: #0284c7; border-radius: 50%;
      position: absolute; top: 35px; left: 35px;
    }

    .action-touch-btn {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid rgba(2, 132, 199, 0.3);
      font-size: 1.4rem; color: #0f172a;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    .action-touch-btn:active {
      background: #0284c7; color: #fff; transform: scale(0.95);
    }

    #btnFire { bottom: 60px; right: 40px; width: 75px; height: 75px; border-color: #e11d48; }
    #btnAim { bottom: 150px; right: 40px; }
    #btnJump { bottom: 60px; right: 130px; }
    #btnReload { bottom: 150px; right: 120px; font-size: 1.1rem; }

    /* Lobby Styling */
    .lobby-wrapper {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; display: flex; justify-content: center; align-items: center;
      background: radial-gradient(circle, #f8fafc 0%, #cbd5e1 100%);
      padding: 20px;
    }
    .lobby-card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 24px; width: 100%; max-width: 500px;
      padding: 32px 28px; text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.08);
    }
    .lobby-header h1 {
      font-size: 2.2rem; font-weight: 900; letter-spacing: -1px;
      color: #0f172a; margin-bottom: 4px;
    }
    .lobby-header p {
      font-size: 0.85rem; color: #64748b; font-weight: 700; text-transform: uppercase;
      margin-bottom: 22px;
    }

    .p2p-panel {
      display: flex; flex-direction: column; gap: 14px;
      margin-bottom: 20px; background: #f1f5f9;
      padding: 16px; border-radius: 16px; border: 1px solid #cbd5e1;
    }
    .room-box label {
      display: block; font-size: 0.8rem; font-weight: 700;
      color: #475569; text-align: left; margin-bottom: 6px;
    }
    .copy-row, .join-row { display: flex; gap: 8px; }
    .copy-row input, .join-row input {
      flex: 1; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #cbd5e1; background: #ffffff;
      font-size: 0.9rem; font-family: monospace; font-weight: bold; color: #0f172a;
    }
    .copy-row button, .join-row button {
      padding: 10px 16px; border-radius: 8px; border: none;
      background: #0284c7; color: #fff; font-weight: 800; cursor: pointer;
    }
    .copy-row button:hover, .join-row button:hover { background: #0369a1; }

    .lobby-buttons-row { display: flex; flex-direction: column; gap: 10px; }
    .btn-play {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff; font-size: 1rem; font-weight: 800; letter-spacing: 0.5px;
      cursor: pointer; box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
      transition: transform 0.2s;
    }
    .btn-play:hover { transform: translateY(-2px); }

    .lobby-footer-note {
      font-size: 0.75rem; color: #94a3b8; margin-top: 18px; line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="gameViewport"></div>

  <!-- HUD -->
  <div id="gameHUD" class="hud-overlay" style="display: none;">
    <div class="crosshair"></div>

    <div class="hud-top">
      <div class="team-score blue-team">YOU: <span id="blueScore">0</span></div>
      <div class="match-timer" id="connectionStatus">P2P STANDBY</div>
      <div class="team-score red-team">RIVAL: <span id="redScore">0</span></div>
    </div>

    <div class="hud-bottom-stats">
      <div class="health-card">
        <span class="stat-label">HEALTH</span>
        <div class="health-bar-bg">
          <div class="health-bar-fill" id="hpBar"></div>
        </div>
        <span class="stat-num" id="hpText">100</span>
      </div>

      <div class="ammo-card">
        <span class="stat-label">RIFLE</span>
        <div class="ammo-display">
          <span class="ammo-current" id="ammoCurrent">30</span>
          <span class="ammo-divider">/</span>
          <span class="ammo-reserve" id="ammoReserve">90</span>
        </div>
      </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobileControlsLayer" class="mobile-hud">
      <div id="touchJoystick" class="hud-element" data-id="joystick">
        <div class="joystick-base">
          <div class="joystick-knob" id="joystickKnob"></div>
        </div>
      </div>

      <button id="btnFire" class="hud-element action-touch-btn fire-touch" data-id="fire">🔥</button>
      <button id="btnAim" class="hud-element action-touch-btn aim-touch" data-id="aim">🎯</button>
      <button id="btnJump" class="hud-element action-touch-btn jump-touch" data-id="jump">⬆</button>
      <button id="btnReload" class="hud-element action-touch-btn reload-touch" data-id="reload">🔄</button>
    </div>
  </div>

  <!-- Lobby & 1v1 Room Code System -->
  <div id="lobbyScreen" class="lobby-wrapper">
    <div class="lobby-card">
      <div class="lobby-header">
        <h1>VORTEX</h1>
        <p>1v1 Tactical P2P Arena</p>
      </div>

      <!-- Room Code Controls -->
      <div class="p2p-panel">
        <div class="room-box">
          <label>Your Room ID:</label>
          <div class="copy-row">
            <input type="text" id="myPeerId" readonly value="Generating ID...">
            <button onclick="copyMyId()">Copy</button>
          </div>
        </div>

        <div class="room-box">
          <label>Join Friend's Room:</label>
          <div class="join-row">
            <input type="text" id="friendPeerId" placeholder="Paste friend's ID here">
            <button class="btn-join" onclick="joinFriend()">Connect ⚔️</button>
          </div>
        </div>
      </div>

      <div class="lobby-buttons-row">
        <button class="btn-play" onclick="startSinglePractice()">Single Practice (Bots) 🤖</button>
      </div>

      <div class="lobby-footer-note">
        Ek jan apna ID copy karke dost ko de, doosra paste karke <strong>Connect</strong> dabaye!
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
